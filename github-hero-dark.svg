<clipPath id="bc"><rect x="150" y="151" width="420" height="3" rx="1.5"/></clipPath>
<g clip-path="url(#bc)"><rect class="sweep" x="0" y="151" width="220" height="3" rx="1.5" fill="url(#sg)"/></g>
</svg>