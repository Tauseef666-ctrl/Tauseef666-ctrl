<linearGradient id="sg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c6cff" stop-opacity="0"/><stop offset=".5" stop-color="#4cc9d8"/><stop offset="1" stop-color="#39a982" stop-opacity="0"/></linearGradient>
</defs>
<rect x="1" y="1" width="718" height="168" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
<circle cx="26" cy="27" r="5" fill="#39a982" class="dot"/>
<text x="40" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b93a1">TAUSEEF KHAN · LIVE DASHBOARD</text>
