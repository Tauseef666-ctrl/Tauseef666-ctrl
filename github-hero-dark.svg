<svg xmlns="http://www.w3.org/2000/svg" width="720" height="170" viewBox="0 0 720 170">
<style>@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@keyframes sweep{0%{transform:translateX(-260px)}100%{transform:translateX(860px)}}.caret{animation:blink 1.1s step-end infinite}.dot{animation:pulse 2.4s ease-in-out infinite}.sweep{animation:sweep 5s linear infinite}</style>
