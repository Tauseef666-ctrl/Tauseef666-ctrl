name: Generate Contribution Snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Generate the contribution snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-snake-dark.svg?palette=github-dark&color_snake=%234cc9d8&color_dots=%23111a18,%2316325d,%231d5b48,%23278263,%2339a982
            dist/github-contribution-snake-light.svg?color_snake=%230e7490&color_dots=%23ecf3f1,%23cfe8df,%239fd6c3,%2358a88b,%232e7d63

      - name: Push the generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}